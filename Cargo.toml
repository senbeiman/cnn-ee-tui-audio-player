[package]
name = "cnn-ee-tui-audio-player"
version = "0.1.0"
edition = "2021"
authors = ["akiko.kusaka"]
description = "Terminal-based music player for English learning"

[package.metadata.bundle]
name = "CNN EE Audio Player"
identifier = "jp.akiko.cnn-ee-tui-audio-player"
icon = ["assets/cnn-logo-red-background.png"]
category = "public.app-category.education"
short_description = "CNN English Express TUI audio player"
long_description = """
Terminal-based audio player for CNN English Express MP3 files.
"""

[[bin]]
name = "play-cnnee"
path = "src/main.rs"

[dependencies]
ratatui = "0.24"
crossterm = "0.27"
rodio = "0.17"
walkdir = "2.4"
anyhow = "1.0"
symphonia = "0.5"
